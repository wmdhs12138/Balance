org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Proxy settings disabled in this environment
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7892
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7892

# Use native ARM64 aapt2 (no QEMU needed)
android.aapt2FromMavenOverride=/workspace/android-sdk/wrappers/aapt2
